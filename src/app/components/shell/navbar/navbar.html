<header class="sticky top-0 z-50 border-b border-hairline bg-bg-void/80 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <!-- Wordmark-only crop, not the full lockup: the master bakes in "use the force.", which
         turns to mush below ~40px. The footer carries the lockup where there is room. -->
    <a [routerLink]="'/' | loc" class="focus-ring">
      <img src="brand/nf1-wordmark.png" width="1214" height="150"
           class="h-6 w-auto sm:h-7" [alt]="'brand.homeAlt' | translate">
    </a>
    <div class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path | loc" routerLinkActive="text-accent"
           class="text-sm text-text-secondary hover:text-text-primary focus-ring">
          {{ link.key | translate }}
        </a>
      }
      <nf-lang-switcher />
      <a [routerLink]="'/contact' | loc" class="accent-button px-4 py-2 text-sm focus-ring">{{ 'nav.book' | translate }}</a>
    </div>
    <button type="button" (click)="ui.toggleMobileNav()"
            class="ghost-button px-3 py-2 text-sm md:hidden focus-ring"
            aria-controls="mobile-nav-panel" [attr.aria-expanded]="ui.mobileNavOpen()">
      {{ 'nav.menu' | translate }}
    </button>
  </nav>
  @if (ui.mobileNavOpen()) {
    <div id="mobile-nav-panel" class="border-t border-hairline px-6 py-4 md:hidden">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path | loc" (click)="ui.closeMobileNav()"
           class="block py-2 text-sm text-text-secondary focus-ring">{{ link.key | translate }}</a>
      }
      <div class="py-2"><nf-lang-switcher /></div>
      <a [routerLink]="'/contact' | loc" (click)="ui.closeMobileNav()" class="accent-button mt-3 block px-4 py-2 text-center text-sm focus-ring">{{ 'nav.book' | translate }}</a>
    </div>
  }
</header>
