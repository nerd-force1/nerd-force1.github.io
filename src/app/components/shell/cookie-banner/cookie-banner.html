@if (consent.bannerVisible()) {
  <div class="fixed inset-x-0 bottom-0 z-50 border-t border-hairline bg-bg-elevated px-6 py-4">
    <div class="mx-auto flex max-w-7xl flex-col items-start gap-3 md:flex-row md:items-center md:justify-between">
      <p class="text-sm text-text-secondary">{{ 'consent.text' | translate }}</p>
      <div class="flex gap-3">
        <button type="button" (click)="consent.rejectNonEssential()" class="ghost-button px-4 py-2 text-sm focus-ring">{{ 'consent.decline' | translate }}</button>
        <button type="button" (click)="consent.acceptAll()" class="accent-button px-4 py-2 text-sm focus-ring">{{ 'consent.accept' | translate }}</button>
      </div>
    </div>
  </div>
}
