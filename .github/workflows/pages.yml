name: pages
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx ng test
      - run: npm run check:design
      - run: npm run check:links
      - run: npm run check:sitemap
      - run: npm run build
      # GitHub Pages serves 404.html for any URL without a file. The client-side
      # shell boots the app there, whose `**` route renders the not-found page.
      - run: cp dist/frontend/browser/index.csr.html dist/frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/frontend/browser }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
